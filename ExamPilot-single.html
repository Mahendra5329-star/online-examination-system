<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f2a56">
<title>ExamPilot — Online Examination System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{navy:{50:"#eff5ff",100:"#dce9ff",600:"#1f4f99",700:"#183f7a",800:"#123261",900:"#0c2345"}}}}};
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}button,input{font:inherit}.focus-ring:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const Icon=({name,size=20,...p})=>{const ref=React.useRef(null);React.useEffect(()=>{if(ref.current&&window.lucide){const el=document.createElement("i");el.setAttribute("data-lucide",name);ref.current.replaceWith(el);lucide.createIcons();ref.current=el}},[]);return <i ref={ref} data-lucide={name} width={size} height={size} {...p}/>};

const EXAMS=[
{id:"frontend",title:"Frontend Development",subtitle:"HTML, CSS, JavaScript & React",questions:8,duration:10,pass:60,questionsData:[
{q:"Which HTML element is used for the largest heading?",options:["<h6>","<heading>","<h1>","<head>"],answer:2,explanation:"<h1> represents the highest-level heading."},
{q:"Which CSS property controls the space inside an element's border?",options:["margin","padding","gap","spacing"],answer:1,explanation:"Padding is the inner spacing between content and border."},
{q:"Which keyword declares a block-scoped variable that can be reassigned?",options:["const","let","var","static"],answer:1,explanation:"let creates a block-scoped binding that can be reassigned."},
{q:"What does JSX primarily let you do in React?",options:["Write SQL","Describe UI with HTML-like syntax","Style databases","Compile CSS"],answer:1,explanation:"JSX provides a concise syntax for describing React UI."},
{q:"Which HTTP method is conventionally used to retrieve data?",options:["POST","PATCH","GET","DELETE"],answer:2,explanation:"GET is intended for retrieving representations of resources."},
{q:"What does CSS Flexbox primarily help with?",options:["2D database queries","One-dimensional layout","Image compression","Server routing"],answer:1,explanation:"Flexbox is designed for one-dimensional row/column layouts."},
{q:"Which React hook is commonly used for local component state?",options:["useState","useRoute","useClass","useFetchState"],answer:0,explanation:"useState adds state to a function component."},
{q:"Which attribute provides alternative text for an image?",options:["title","src","alt","label"],answer:2,explanation:"The alt attribute provides a text alternative for an image."}]},
{id:"general",title:"General Knowledge",subtitle:"Science, geography & world facts",questions:8,duration:8,pass:60,questionsData:[
{q:"What is the largest planet in our solar system?",options:["Earth","Saturn","Jupiter","Neptune"],answer:2,explanation:"Jupiter is the largest planet in the solar system."},
{q:"Which gas do plants primarily absorb during photosynthesis?",options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],answer:1,explanation:"Plants use carbon dioxide as a carbon source during photosynthesis."},
{q:"Which is the longest river in South America?",options:["Amazon","Paraná","Orinoco","Madeira"],answer:0,explanation:"The Amazon is the longest river in South America."},
{q:"How many continents are commonly recognized?",options:["5","6","7","8"],answer:2,explanation:"The common model recognizes seven continents."},
{q:"What is H2O?",options:["Salt","Water","Oxygen","Hydrogen peroxide"],answer:1,explanation:"H2O is the chemical formula for water."},
{q:"Which instrument measures atmospheric pressure?",options:["Thermometer","Barometer","Hygrometer","Anemometer"],answer:1,explanation:"A barometer measures atmospheric pressure."},
{q:"Which country is home to the city of Kyoto?",options:["China","South Korea","Japan","Thailand"],answer:2,explanation:"Kyoto is a historic city in Japan."},
{q:"What is the nearest star to Earth?",options:["Sirius","Proxima Centauri","The Sun","Polaris"],answer:2,explanation:"The Sun is Earth's nearest star."}]}
];

const shuffle=a=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c};
const createSession=exam=>{const questions=shuffle(exam.questionsData).map(item=>({...item,options:shuffle(item.options.map((text,index)=>({text,correct:index===item.answer})))}));return{questions,answers:Array(questions.length).fill(null),flagged:Array(questions.length).fill(false),current:0,secondsLeft:exam.duration*60}};
const formatTime=n=>`${String(Math.max(0,Math.floor(n/60))).padStart(2,"0")}:${String(Math.max(0,n%60)).padStart(2,"0")}`;

function App(){
const[screen,setScreen]=useState("home"),[selectedExam,setSelectedExam]=useState(null),[session,setSession]=useState(null),[result,setResult]=useState(null),[sidebarOpen,setSidebarOpen]=useState(false);
const startExam=exam=>{setSelectedExam(exam);setSession(createSession(exam));setResult(null);setScreen("exam");setSidebarOpen(false)};
const submitExam=reason=>{if(!session||!selectedExam)return;const correct=session.answers.reduce((t,s,i)=>t+(s!==null&&session.questions[i].options[s]?.correct?1:0),0);const attempted=session.answers.filter(a=>a!==null).length;const percentage=Math.round(correct/session.questions.length*100);const elapsed=selectedExam.duration*60-session.secondsLeft;setResult({correct,attempted,percentage,passed:percentage>=selectedExam.pass,elapsed,reason});setScreen("results")};
useEffect(()=>{if(screen!=="exam"||!session)return;const id=setInterval(()=>setSession(prev=>{if(!prev)return prev;if(prev.secondsLeft<=1){setTimeout(()=>submitExam("time"),0);return{...prev,secondsLeft:0}}return{...prev,secondsLeft:prev.secondsLeft-1}}),1000);return()=>clearInterval(id)},[screen]);
const answer=i=>setSession(s=>({...s,answers:s.answers.map((a,x)=>x===s.current?i:a)}));
const go=i=>{setSession(s=>({...s,current:i}));setSidebarOpen(false)};
const flag=()=>setSession(s=>({...s,flagged:s.flagged.map((f,i)=>i===s.current?!f:f)}));
const progress=session?Math.round(session.answers.filter(a=>a!==null).length/session.questions.length*100):0;
return <div className="min-h-screen bg-slate-50">
{screen!=="exam"&&<header className="border-b border-slate-200 bg-white"><div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"><button className="focus-ring flex items-center gap-3" onClick={()=>setScreen("home")}><span className="grid h-10 w-10 place-items-center rounded-xl bg-navy-800 text-white"><Icon name="graduation-cap" size={23}/></span><span className="text-left"><span className="block text-lg font-bold text-navy-900">ExamPilot</span><span className="hidden text-xs text-slate-500 sm:block">Online Examination System</span></span></button><div className="hidden items-center gap-5 text-sm font-medium text-slate-600 sm:flex"><button onClick={()=>setScreen("home")} className="focus-ring flex items-center gap-2 hover:text-navy-800"><Icon name="home" size={17}/> Exams</button><span className="flex items-center gap-2"><Icon name="shield-check" size={17}/> Secure session</span></div></div></header>}
{screen==="home"&&<Home exams={EXAMS} start={startExam}/>}
{screen==="exam"&&session&&selectedExam&&<Exam exam={selectedExam} session={session} progress={progress} open={sidebarOpen} setOpen={setSidebarOpen} answer={answer} go={go} flag={flag} submit={()=>submitExam("manual")}/>}
{screen==="results"&&result&&selectedExam&&<Results exam={selectedExam} session={session} result={result} home={()=>setScreen("home")} retry={()=>startExam(selectedExam)}/>}
</div>
}

const Stat=({icon,label,value})=><div className="px-2 text-center"><div className="flex justify-center gap-1 text-slate-400"><Icon name={icon} size={15}/><span className="text-[10px] font-semibold uppercase tracking-wide">{label}</span></div><p className="mt-1 text-sm font-bold text-slate-800">{value}</p></div>;

function Home({exams,start}){return <main className="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
<section className="overflow-hidden rounded-3xl bg-navy-900 p-6 text-white shadow-xl sm:p-10"><div className="max-w-2xl"><span className="mb-4 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-xs font-semibold"><Icon name="award" size={14}/> Ready when you are</span><h1 className="text-3xl font-bold tracking-tight sm:text-4xl">Welcome back, Candidate.</h1><p className="mt-3 max-w-xl text-sm leading-6 text-blue-100 sm:text-base">Choose an available exam below. Your questions and answer choices are randomized at the start of every session.</p></div></section>
<div className="mt-8 flex items-end justify-between"><div><p className="text-sm font-semibold text-navy-700">Available examinations</p><h2 className="mt-1 text-2xl font-bold text-slate-900">Choose your assessment</h2></div><span className="hidden rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 sm:block">{exams.length} active exams</span></div>
<div className="mt-5 grid gap-5 md:grid-cols-2">{exams.map(e=><article key={e.id} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md sm:p-6"><div className="flex items-start justify-between gap-4"><div className="grid h-12 w-12 place-items-center rounded-xl bg-blue-50 text-navy-700"><Icon name="book-open-check" size={24}/></div><span className="rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700">ACTIVE</span></div><h3 className="mt-5 text-xl font-bold text-slate-900">{e.title}</h3><p className="mt-1 text-sm text-slate-500">{e.subtitle}</p><div className="mt-5 grid grid-cols-3 divide-x rounded-xl border border-slate-100 bg-slate-50 py-3"><Stat icon="layout-grid" label="Questions" value={e.questions}/><Stat icon="clock-3" label="Duration" value={`${e.duration} min`}/><Stat icon="trophy" label="Pass mark" value={`${e.pass}%`}/></div><button onClick={()=>start(e)} className="focus-ring mt-5 flex w-full items-center justify-center gap-2 rounded-xl bg-navy-800 px-4 py-3 font-semibold text-white hover:bg-navy-700">Start Exam <Icon name="arrow-right" size={18}/></button></article>)}</div>
<div className="mt-8 grid gap-4 sm:grid-cols-3">{[["Randomized questions","Every session gets a fresh order."],["Instant grading","See your score immediately."],["Accessible design","Keyboard-friendly and responsive."]].map(([t,x])=><div key={t} className="rounded-2xl border border-slate-200 bg-white p-5"><Icon name="check-circle-2" className="text-emerald-600" size={21}/><h3 className="mt-3 font-bold">{t}</h3><p className="mt-1 text-sm leading-5 text-slate-500">{x}</p></div>)}</div>
</main>}

function Exam({exam,session,progress,open,setOpen,answer,go,flag,submit}){
const q=session.questions[session.current],urgent=session.secondsLeft<=60,answered=session.answers[session.current]!==null;
return <div className="min-h-screen bg-slate-100"><header className="sticky top-0 z-30 border-b border-slate-200 bg-white shadow-sm"><div className="mx-auto flex max-w-[1500px] items-center justify-between gap-3 px-4 py-3 sm:px-6"><div className="flex min-w-0 items-center gap-3"><button onClick={()=>setOpen(!open)} className="focus-ring rounded-lg p-2 text-slate-600 hover:bg-slate-100 lg:hidden"><Icon name="menu" size={21}/></button><div className="min-w-0"><p className="truncate text-sm font-bold text-navy-900">{exam.title}</p><p className="text-xs text-slate-500">Question {session.current+1} of {session.questions.length}</p></div></div><div className={`flex shrink-0 items-center gap-2 rounded-xl border px-3 py-2 ${urgent?"border-red-200 bg-red-50 text-red-700":"border-slate-200 bg-slate-50 text-navy-900"}`}><Icon name="clock-3" size={18}/><span className="font-mono text-sm font-bold sm:text-base">{formatTime(session.secondsLeft)}</span></div></div><div className="h-1 bg-slate-100"><div className="h-1 bg-navy-700 transition-all" style={{width:`${progress}%`}}/></div></header>
<div className="mx-auto flex max-w-[1500px] gap-6 p-4 sm:p-6"><aside className={`${open?"fixed inset-0 z-20 block bg-slate-900/30 lg:static lg:bg-transparent":"hidden"} lg:block lg:w-72 lg:shrink-0`}><div className={`${open?"absolute left-0 top-0 h-full w-[85%] max-w-sm bg-white p-5 shadow-xl lg:static lg:h-auto lg:w-auto lg:max-w-none lg:p-0 lg:shadow-none":""}`}><div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><div className="flex items-center justify-between"><h2 className="font-bold">Question navigator</h2><button className="lg:hidden" onClick={()=>setOpen(false)}><Icon name="x" size={20}/></button></div><div className="mt-4 grid grid-cols-5 gap-2">{session.questions.map((_,i)=>{const a=session.answers[i]!==null,f=session.flagged[i],c=session.current===i;return <button key={i} onClick={()=>go(i)} className={`focus-ring relative aspect-square rounded-lg text-sm font-bold ${c?"ring-2 ring-navy-700 ring-offset-2":""} ${a?"bg-navy-800 text-white":"bg-slate-100 text-slate-600"}`}>{i+1}{f&&<span className="absolute -right-1 -top-1 h-2.5 w-2.5 rounded-full bg-amber-500 ring-2 ring-white"/>}</button>})}</div><div className="mt-5 space-y-2 text-xs text-slate-500"><div className="flex items-center gap-2"><span className="h-3 w-3 rounded-sm bg-navy-800"/>Answered</div><div className="flex items-center gap-2"><span className="h-3 w-3 rounded-sm border border-slate-200 bg-slate-100"/>Unanswered</div><div className="flex items-center gap-2"><span className="h-3 w-3 rounded-sm bg-amber-500"/>Flagged for review</div></div><div className="mt-5 rounded-xl bg-blue-50 p-3 text-xs leading-5 text-blue-800"><Icon name="info" size={15}/>{progress}% complete.</div></div></div></aside>
<main className="min-w-0 flex-1"><div className="mx-auto max-w-3xl"><div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8"><div className="flex items-center justify-between"><span className="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-navy-700">Question {session.current+1}</span><span className={answered?"text-xs font-semibold text-emerald-600":"text-xs font-semibold text-slate-400"}>{answered?"Answer selected":"Not answered"}</span></div><h1 className="mt-6 text-xl font-bold leading-8 text-slate-900 sm:text-2xl">{q.q}</h1><div className="mt-6 space-y-3">{q.options.map((o,i)=>{const sel=session.answers[session.current]===i;return <label key={i} className={`flex cursor-pointer items-start gap-3 rounded-xl border p-4 transition ${sel?"border-navy-700 bg-blue-50":"border-slate-200 hover:border-slate-300 hover:bg-slate-50"}`}><input type="radio" name={"q"+session.current} checked={sel} onChange={()=>answer(i)} className="mt-1 h-4 w-4 accent-blue-700"/><span className={`grid h-7 w-7 shrink-0 place-items-center rounded-lg text-xs font-bold ${sel?"bg-navy-800 text-white":"bg-slate-100 text-slate-600"}`}>{String.fromCharCode(65+i)}</span><span className="pt-0.5 text-sm font-medium leading-6 text-slate-700">{o.text}</span></label>})}</div><div className="mt-7 flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:flex-row sm:items-center sm:justify-between"><button onClick={()=>go(Math.max(0,session.current-1))} disabled={session.current===0} className="focus-ring inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-700 disabled:opacity-40"><Icon name="arrow-left" size={17}/> Previous</button><div className="flex gap-2"><button onClick={flag} className={`focus-ring inline-flex flex-1 items-center justify-center gap-2 rounded-xl border px-4 py-3 text-sm font-semibold ${session.flagged[session.current]?"border-amber-300 bg-amber-50 text-amber-700":"border-slate-200 text-slate-700"}`}><Icon name="flag" size={17}/> <span className="hidden sm:inline">{session.flagged[session.current]?"Unflag":"Flag"}</span></button>{session.current<session.questions.length-1?<button onClick={()=>go(session.current+1)} className="focus-ring inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-navy-800 px-5 py-3 text-sm font-semibold text-white">Next <Icon name="arrow-right" size={17}/></button>:<button onClick={submit} className="focus-ring inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white">Submit Exam <Icon name="check" size={17}/></button>}</div></div></div><div className="mt-4 flex justify-center"><button onClick={submit} className="text-xs font-semibold text-slate-500 underline underline-offset-4 hover:text-red-600">Submit exam now</button></div></div></main></div></div>}

function Results({exam,session,result,home,retry}){return <main className="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8"><div className="mx-auto max-w-3xl text-center"><div className={`mx-auto grid h-16 w-16 place-items-center rounded-full ${result.passed?"bg-emerald-50 text-emerald-600":"bg-red-50 text-red-600"}`}><Icon name={result.passed?"trophy":"x-circle"} size={30}/></div><p className="mt-4 text-sm font-semibold text-slate-500">Exam completed</p><h1 className="mt-1 text-3xl font-bold">{result.passed?"Congratulations!":"Keep practicing!"}</h1><p className="mt-2 text-sm text-slate-500">{exam.title} · {result.reason==="time"?"Automatically submitted when time expired":"Submitted successfully"}</p></div><div className="mx-auto mt-8 grid max-w-4xl gap-4 sm:grid-cols-4">{[["Score",`${result.correct}/${exam.questions}`,"award"],["Percentage",`${result.percentage}%`,"trophy"],["Status",result.passed?"PASS":"FAIL",result.passed?"check-circle-2":"x-circle"],["Time taken",formatTime(result.elapsed),"clock-3"]].map(([l,v,ic])=><div key={l} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><Icon name={ic} size={18} className="mb-3 text-navy-700"/><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">{l}</p><p className="mt-1 text-xl font-bold">{v}</p></div>)}</div><div className="mx-auto mt-8 max-w-4xl rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><div className="border-b border-slate-100 pb-5"><h2 className="text-xl font-bold">Question review</h2><p className="mt-1 text-sm text-slate-500">Compare your selections with the correct answers.</p></div><div className="mt-5 space-y-4">{session.questions.map((q,i)=>{const s=session.answers[i],ci=q.options.findIndex(o=>o.correct),ok=s!==null&&q.options[s]?.correct;return <article key={i} className={`rounded-xl border p-4 ${ok?"border-emerald-100 bg-emerald-50/40":"border-red-100 bg-red-50/30"}`}><div className="flex gap-3"><div className={`grid h-8 w-8 shrink-0 place-items-center rounded-full ${ok?"bg-emerald-100 text-emerald-700":"bg-red-100 text-red-700"}`}><Icon name={ok?"check":"x"} size={16}/></div><div><p className="text-sm font-bold leading-6">{i+1}. {q.q}</p><p className="mt-2 text-sm"><b>Your answer: </b>{s===null?<span className="text-red-700">Not answered</span>:<span className={ok?"text-emerald-700":"text-red-700"}>{String.fromCharCode(65+s)}. {q.options[s].text}</span>}</p><p className="mt-1 text-sm"><b>Correct answer: </b>{String.fromCharCode(65+ci)}. {q.options[ci].text}</p><p className="mt-2 text-xs leading-5 text-slate-500">{q.explanation}</p></div></div></article>})}</div></div><div className="mx-auto mt-6 flex max-w-4xl flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button onClick={home} className="focus-ring inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold"><Icon name="home" size={17}/> Back to Exams</button><button onClick={retry} className="focus-ring inline-flex items-center justify-center gap-2 rounded-xl bg-navy-800 px-5 py-3 text-sm font-semibold text-white"><Icon name="rotate-ccw" size={17}/> Retake Exam</button></div></main>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
